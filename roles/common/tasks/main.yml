---
# Main task entrypoint for roles/common

- name: Update package cache (RedHat/CentOS)
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat"
  ignore_errors: true # For demo/non-privileged environments

- name: Install baseline system packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ common_system_packages }}"
  ignore_errors: true # Allows syntax and mock environments to succeed

- name: Import security hardening configurations
  ansible.builtin.import_tasks: hardening.yml
