---
# OS and SSH Hardening Tasks
# Mapped to CIS CentOS/RHEL 8 Benchmarks and DISA STIG controls

- name: Load Compliance Exception Register
  ansible.builtin.include_vars:
    file: exceptions.yml
    name: security_exceptions
  # Suppress error if run in isolated testing environments
  ignore_errors: true

- name: Apply kernel sysctl hardening parameters | CIS 3.1 & 3.2
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
    state: present
    reload: true
  loop: "{{ common_sysctl_settings }}"
  when: 
    - common_sysctl_settings is defined
    - "'sysctl_hardening' not in (security_exceptions.active_exceptions | default([]))"
  tags:
    - compliance
    - cis_3_1
    - cis_3_2

- name: Enforce secure SSH Port | DISA STIG RHEL-08-010500
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port\s'
    line: "Port {{ common_ssh_port }}"
    state: present
  when: "'custom_ssh_port' not in (security_exceptions.active_exceptions | default([]))"
  notify: restart sshd
  tags:
    - compliance
    - stig_RHEL-08-010500

- name: Disable Root Login over SSH | DISA STIG RHEL-08-010490
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s'
    line: "PermitRootLogin {{ common_ssh_permit_root_login }}"
    state: present
  when: "'ssh_root_login' not in (security_exceptions.active_exceptions | default([]))"
  notify: restart sshd
  tags:
    - compliance
    - stig_RHEL-08-010490

- name: Disable Password Authentication over SSH | DISA STIG RHEL-08-010480
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s'
    line: "PasswordAuthentication {{ common_ssh_password_authentication }}"
    state: present
  when: "'ssh_password_auth' not in (security_exceptions.active_exceptions | default([]))"
  notify: restart sshd
  tags:
    - compliance
    - stig_RHEL-08-010480

- name: Ensure firewalld is running and enabled | CIS 3.6
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags:
    - compliance
    - cis_3_6

- name: Allow SSH traffic through firewalld on custom port | CIS 3.6
  ansible.posix.firewalld:
    port: "{{ common_ssh_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  notify: reload firewalld
  tags:
    - compliance
    - cis_3_6
