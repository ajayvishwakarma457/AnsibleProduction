---
- name: Enterprise Secrets Integration (HashiCorp Vault & AWS Secrets Manager)
  hosts: localhost
  gather_facts: false
  
  vars:
    # HashiCorp Vault access settings
    vault_addr: "https://vault.enterprise.internal:8200"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('mock_token_abc') }}"
    
    # AWS configuration boundaries
    aws_region: "us-east-1"
    aws_profile: "automation"

  tasks:
    - name: 1. Lookup Database Password from HashiCorp Vault
      ansible.builtin.set_fact:
        # Utilizing lookup to fetch secrets dynamically in-memory at task runtime
        db_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'database/production', engine_version=2, url=vault_addr, token=vault_token).data.password | default('fallback_secure_vault_pass_987') }}"
      no_log: true # Critical: Prevents sensitive value from being printed in logs/stdout

    - name: Verify Secret Retrieval (Safe Output Demo)
      ansible.builtin.debug:
        msg: "Database password successfully fetched from HashiCorp Vault. Length of password: {{ db_password | length }} characters."

    - name: 2. Fetch Nginx Private Key from AWS Secrets Manager
      ansible.builtin.set_fact:
        # Fetching secrets at runtime via amazon.aws.secretsmanager_secret lookup
        ssl_private_key: "{{ lookup('amazon.aws.secretsmanager_secret', 'production/nginx/ssl_key', region=aws_region) | default('---BEGIN PRIVATE KEY---\\nMockSSLKeyContent\\n---END PRIVATE KEY---') }}"
      no_log: true # Critical: Prevents printing private key in Ansible stdout
      ignore_errors: true

    - name: Verify AWS Secret Retrieval (Safe Output Demo)
      ansible.builtin.debug:
        msg: "Nginx SSL Private Key successfully fetched from AWS Secrets Manager. Validating key headers: {{ ssl_private_key.split('\\n')[0] }} ..."

    - name: 3. Set dynamic variables in memory for target nodes
      # Injecting the dynamically retrieved secrets into variables on the target DB and Web servers
      ansible.builtin.set_fact:
        db_user_password: "{{ db_password }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['databases'] | default([]) }}"
      no_log: true
