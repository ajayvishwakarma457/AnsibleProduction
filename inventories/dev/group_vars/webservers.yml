---
# Dev Web Servers Configuration
web_server_port: 80
web_server_ssl_port: 443
web_server_domain: dev-app.local
web_server_doc_root: /var/web/dev-app

# Nginx Hardened configuration settings
web_server_client_max_body_size: 10m
web_server_keepalive_timeout: 65

# Self-signed certificate details for dev environment (would be real CA/ACM certs in prod)
ssl_cert_country: US
ssl_cert_state: CA
ssl_cert_locality: San Francisco
ssl_cert_organization: Enterprise Dev Corp
ssl_cert_common_name: "{{ web_server_domain }}"
ssl_cert_dir: /etc/nginx/ssl
ssl_key_path: "{{ ssl_cert_dir }}/nginx.key"
ssl_crt_path: "{{ ssl_cert_dir }}/nginx.crt"
